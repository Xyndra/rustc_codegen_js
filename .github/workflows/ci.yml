name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build, test, site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup
          key: rust-toolchain-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: rust-toolchain-${{ runner.os }}-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-15
          components: rustc-dev rust-src

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/dgs_web -> examples/dgs_web/target

      - name: Install cargo-build-js
        run: cargo install --path tools/cargo-build-js --force

      - name: Build backend and examples/dgs_web with codegen backend
        run: cargo build-js --manifest-path examples/dgs_web/Cargo.toml -p dgs-site --release
        env:
          RUST_LOG: info

      - name: Upload dgs site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dgs-playground-site
          path: |
            examples/dgs_web/target/release/dgs-playground/
          if-no-files-found: warn

      - name: Run corpus differential tests
        run: sh tests/diff.sh
