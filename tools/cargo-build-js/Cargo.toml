cargo-features = ["profile-rustflags"]

[package]
name = "cargo-build-js"
version = "0.1.0"
edition = "2021"
description = "Cargo wrapper for rustc_codegen_js (embedded backend, no configs)"
license = "MIT"

[[bin]]
name = "cargo-build-js"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[build-dependencies]
rustc_codegen_js = { path = "../.." }
