cargo-features = ["profile-rustflags"]
# Workspace for rustc_codegen_js browser ports.
# `cargo build-js` (see `tools/cargo-build-js`) compiles workspace crates
# to JavaScript. `dgs-site` (normal-)depends on `dgs`/`dgs-playground`, so
# one command builds everything from a clean target dir:
#   cargo build-js -p dgs-site
[workspace]
resolver = "2"
members = ["dgs-playground", "dgs-quicktest", "dgs-site"]
