[package]
name = "typst-browser"
version = "0.0.0"
edition = "2021"

[dependencies]
# Published crate, untouched: no path overrides, no vendor copies.
# `default-features = false` drops resvg (PNG rasterization needs a raster
# pipeline the JS backend has no equivalent for); SVG is pure data work.
dgs = { version = "0.1", default-features = false }
