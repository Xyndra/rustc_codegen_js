[package]
name = "dgs-site"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
dgs-playground = { version = "0.1.0", path = "../dgs-playground" }
dgs = { version = "0.1", default-features = false }


[build-dependencies]
oxc_minifier = "0.154.0"
oxc_allocator = "0.154.0"
oxc_parser = "0.154.0"
oxc_span = "0.154.0"
oxc_codegen = "0.154.0"
oxc_mangler = "0.154.0"
regex = "1"
